[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solpoc-optimizer"
version = "0.1.0"
description = "Experiment scheduler and optimizer for SolPOC"
readme = "README.md"
requires-python = ">=3.9"

authors = [
    { name = "Alexiane Feuillet" }
]

dependencies = [
    "solpoc>=0.9.7",
    "numpy",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "pytest-cov",
    "twine"
]

[project.scripts]
solpoc-optimize = "solpoc_optimizer.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["solpoc_optimizer*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]